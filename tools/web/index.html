<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>sysmon</title>
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230ca30c'/></svg>">
</head>
<body>

<header>
  <div class="marca">sysmon</div>
  <span class="pilula" id="contagem"></span>

  <div class="resumo">
    <span class="pilula fraca" id="relogio"></span>

    <!-- Só aparecem quando há janela nativa em volta: numa aba de browser
         nenhum dos dois faria sentido. -->
    <button class="icone" id="fixar" type="button" hidden
            title="Manter a janela sempre sobre as outras"
            aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true" width="15" height="15">
        <path d="M12.3 2.1 17.9 7.7a1 1 0 0 1-.5 1.7l-2.2.5-4.3 4.3.5 2.2a1 1 0 0 1-1.7.5L4.1 11.3a1 1 0 0 1 .5-1.7l2.2-.5 4.3-4.3-.5-2.2a1 1 0 0 1 1.7-.5Z"
              fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linejoin="round"/>
        <path d="M6.5 13.5 2.6 17.4" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="rotulo-botao">Fixar</span>
    </button>

    <button class="acao" id="atualizar" type="button" title="Atualizar agora (Ctrl+R)">
      Atualizar
    </button>
  </div>
</header>

<section class="alertas" id="alertas" hidden>
  <ul id="lista-alertas"></ul>
</section>

<main id="frota">
  <p class="vazio">Carregando...</p>
</main>

<footer id="rodape"></footer>

<script src="app.js"></script>
</body>
</html>
