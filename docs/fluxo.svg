<svg viewBox="0 0 920 470" width="920" height="470" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace"
     role="img" aria-label="O sysmon na sua maquina envia GET /metrics com Bearer token para varios hosts Linux; cada host responde com suas metricas, mostradas numa janela e na bandeja">

  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- "digitacao" das duas linhas do console: um retangulo de recorte que cresce em largura -->
    <clipPath id="typeReq">
      <rect x="340" y="418" width="0" height="20">
        <animate attributeName="width" dur="3.2s" repeatCount="indefinite"
          keyTimes="0;0.14;1" values="0;312;312"/>
      </rect>
    </clipPath>
    <clipPath id="typeResp">
      <rect x="340" y="418" width="0" height="20">
        <animate attributeName="width" dur="3.2s" repeatCount="indefinite"
          keyTimes="0;0.383;0.52;1" values="0;0;312;312"/>
      </rect>
    </clipPath>
  </defs>

  <!-- moldura, como a janela do app -->
  <rect x="8" y="8" width="904" height="454" rx="18" fill="#0b0e14" stroke="#1b2130" stroke-width="1.5"/>

  <!-- rotulos de secao -->
  <text x="147" y="44" text-anchor="middle" fill="#6b7684" font-size="11" letter-spacing="2">HOSTS  LINUX  ·  AGENTE  GO</text>
  <text x="745" y="74" text-anchor="middle" fill="#6b7684" font-size="11" letter-spacing="2">SUA  MAQUINA  ·  JANELA + BANDEJA</text>

  <!-- ============ CABOS (base) ============ -->
  <g fill="none" stroke="#232c3b" stroke-width="3" stroke-linecap="round">
    <path d="M254,108 C 400,108 470,153 610,153"/>
    <path d="M254,234 C 400,234 470,197 610,197"/>
    <path d="M254,360 C 400,360 470,241 610,241"/>
  </g>

  <!-- fluxo tenue continuo (link vivo) -->
  <g fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.2">
    <path d="M254,108 C 400,108 470,153 610,153" stroke="#3fb950">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M254,234 C 400,234 470,197 610,197" stroke="#f85149">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M254,360 C 400,360 470,241 610,241" stroke="#3fb950">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.35s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ CICLO: request (janela->host, azul + token) e resposta (host->janela) ============ -->
  <!-- envelope azul = request -->
  <g filter="url(#glow)">
    <rect x="-5" y="-3.5" width="10" height="7" rx="2" fill="#58a6ff"/>
    <line x1="-4" y1="-1" x2="4" y2="-1" stroke="#0b0e14" stroke-width="0.8" opacity="0.5"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.333;1" keyPoints="0;1;1" path="M610,153 C 470,153 400,108 254,108"/>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.32;0.34;1"/>
  </g>
  <g filter="url(#glow)">
    <rect x="-5" y="-3.5" width="10" height="7" rx="2" fill="#58a6ff"/>
    <line x1="-4" y1="-1" x2="4" y2="-1" stroke="#0b0e14" stroke-width="0.8" opacity="0.5"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.333;1" keyPoints="0;1;1" path="M610,197 C 470,197 400,234 254,234"/>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.32;0.34;1"/>
  </g>
  <g filter="url(#glow)">
    <rect x="-5" y="-3.5" width="10" height="7" rx="2" fill="#58a6ff"/>
    <line x1="-4" y1="-1" x2="4" y2="-1" stroke="#0b0e14" stroke-width="0.8" opacity="0.5"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.333;1" keyPoints="0;1;1" path="M610,241 C 470,241 400,360 254,360"/>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.32;0.34;1"/>
  </g>

  <!-- ponto colorido = resposta (host->janela), sai depois que o request chega -->
  <g filter="url(#glow)">
    <circle r="3.6" fill="#3fb950"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.367;0.7;1" keyPoints="0;0;1;1" path="M254,108 C 400,108 470,153 610,153"/>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.366;0.367;0.7;0.701"/>
  </g>
  <g filter="url(#glow)">
    <circle r="3.6" fill="#f85149"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.367;0.7;1" keyPoints="0;0;1;1" path="M254,234 C 400,234 470,197 610,197"/>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.366;0.367;0.7;0.701"/>
  </g>
  <g filter="url(#glow)">
    <circle r="3.6" fill="#3fb950"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.367;0.7;1" keyPoints="0;0;1;1" path="M254,360 C 400,360 470,241 610,241"/>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.366;0.367;0.7;0.701"/>
  </g>

  <!-- ============ HOSTS ============ -->
  <!-- host A: pve -->
  <g>
    <rect x="40" y="62" width="214" height="92" rx="12" fill="#0f131b" stroke="#1b2130" stroke-width="1.5"/>
    <rect x="54" y="82" width="30" height="52" rx="5" fill="#0b0e14" stroke="#2a3444"/>
    <rect x="60" y="90" width="18" height="6" rx="2" fill="#182031"/>
    <rect x="60" y="102" width="18" height="6" rx="2" fill="#182031"/>
    <rect x="60" y="114" width="18" height="6" rx="2" fill="#182031"/>
    <circle cx="63" cy="126" r="2" fill="#3fb950"/>
    <text x="96" y="98" fill="#c9d1d9" font-size="15" font-weight="700">pve<tspan fill="#6b7684" font-size="11" font-weight="400">  Proxmox</tspan></text>
    <text x="96" y="116" fill="#6b7684" font-size="10.5">sysmon-agent</text>
    <rect x="176" y="106" width="24" height="13" rx="6" fill="#10233a" stroke="#1f6feb" stroke-width="0.8"/>
    <text x="188" y="115.5" text-anchor="middle" fill="#58a6ff" font-size="9">Go</text>
    <text x="96" y="136" fill="#6b7684" font-size="10.5">cpu <tspan fill="#c9d1d9">12%</tspan> · <tspan fill="#39c5cf">47°C</tspan></text>
    <circle cx="238" cy="78" r="4.5" fill="#3fb950"/>
    <!-- flash ao responder -->
    <rect x="40" y="62" width="214" height="92" rx="12" fill="none" stroke="#3fb950" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.366;0.44;0.72;1"/>
    </rect>
  </g>

  <!-- host B: nas (em alerta) -->
  <g>
    <rect x="40" y="188" width="214" height="92" rx="12" fill="#0f131b" stroke="#f85149" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="54" y="208" width="30" height="52" rx="5" fill="#0b0e14" stroke="#2a3444"/>
    <rect x="60" y="216" width="18" height="6" rx="2" fill="#182031"/>
    <rect x="60" y="228" width="18" height="6" rx="2" fill="#182031"/>
    <rect x="60" y="240" width="18" height="6" rx="2" fill="#182031"/>
    <circle cx="63" cy="252" r="2" fill="#f85149"/>
    <text x="96" y="224" fill="#c9d1d9" font-size="15" font-weight="700">nas<tspan fill="#6b7684" font-size="11" font-weight="400">  Debian</tspan></text>
    <text x="96" y="242" fill="#6b7684" font-size="10.5">sysmon-agent</text>
    <rect x="176" y="232" width="24" height="13" rx="6" fill="#10233a" stroke="#1f6feb" stroke-width="0.8"/>
    <text x="188" y="241.5" text-anchor="middle" fill="#58a6ff" font-size="9">Go</text>
    <text x="96" y="262" fill="#6b7684" font-size="10.5">disco /tank <tspan fill="#f85149" font-weight="700">91%</tspan></text>
    <circle cx="238" cy="204" r="4.5" fill="#f85149">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="40" y="188" width="214" height="92" rx="12" fill="none" stroke="#f85149" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.366;0.44;0.72;1"/>
    </rect>
  </g>

  <!-- host C: vps -->
  <g>
    <rect x="40" y="314" width="214" height="92" rx="12" fill="#0f131b" stroke="#1b2130" stroke-width="1.5"/>
    <rect x="54" y="334" width="30" height="52" rx="5" fill="#0b0e14" stroke="#2a3444"/>
    <rect x="60" y="342" width="18" height="6" rx="2" fill="#182031"/>
    <rect x="60" y="354" width="18" height="6" rx="2" fill="#182031"/>
    <rect x="60" y="366" width="18" height="6" rx="2" fill="#182031"/>
    <circle cx="63" cy="378" r="2" fill="#3fb950"/>
    <text x="96" y="350" fill="#c9d1d9" font-size="15" font-weight="700">vps<tspan fill="#6b7684" font-size="11" font-weight="400">  Ubuntu</tspan></text>
    <text x="96" y="368" fill="#6b7684" font-size="10.5">sysmon-agent</text>
    <rect x="176" y="358" width="24" height="13" rx="6" fill="#10233a" stroke="#1f6feb" stroke-width="0.8"/>
    <text x="188" y="367.5" text-anchor="middle" fill="#58a6ff" font-size="9">Go</text>
    <text x="96" y="388" fill="#6b7684" font-size="10.5">cpu <tspan fill="#c9d1d9">4%</tspan> · <tspan fill="#39c5cf">39°C</tspan></text>
    <circle cx="238" cy="330" r="4.5" fill="#3fb950"/>
    <rect x="40" y="314" width="214" height="92" rx="12" fill="none" stroke="#3fb950" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.366;0.44;0.72;1"/>
    </rect>
  </g>

  <!-- ============ JANELA (dashboard na sua maquina) ============ -->
  <g>
    <rect x="610" y="92" width="270" height="284" rx="14" fill="#0f131b" stroke="#1b2130" stroke-width="1.5"/>

    <text x="630" y="118" fill="#c9d1d9" font-size="14" font-weight="700">sysmon<tspan fill="#6b7684" font-size="11" font-weight="400">  ·  3 host · 1 alerta</tspan></text>
    <!-- fechar -->
    <g stroke="#6b7684" stroke-width="1.4" stroke-linecap="round">
      <line x1="857" y1="105" x2="867" y2="115"/>
      <line x1="867" y1="105" x2="857" y2="115"/>
    </g>
    <line x1="628" y1="130" x2="862" y2="130" stroke="#1b2130"/>

    <rect x="618" y="182" width="250" height="24" rx="6" fill="#161b26"/>

    <!-- linha pve -->
    <circle cx="626" cy="153" r="3.5" fill="#3fb950"/>
    <text x="636" y="157" fill="#c9d1d9" font-size="12">pve</text>
    <rect x="676" y="149" width="86" height="8" rx="4" fill="#0b0e14"/>
    <rect x="676" y="149" width="10" height="8" rx="4" fill="#c9d1d9"/>
    <polyline points="772,158 780,155 788,156 796,153 804,155 812,154" fill="none" stroke="#4a5563" stroke-width="1.4"/>
    <text x="858" y="157" text-anchor="end" fill="#c9d1d9" font-size="12">12%</text>

    <!-- linha nas (alerta) -->
    <circle cx="626" cy="197" r="3.5" fill="#f85149"/>
    <text x="636" y="201" fill="#c9d1d9" font-size="12">nas</text>
    <rect x="676" y="193" width="86" height="8" rx="4" fill="#0b0e14"/>
    <rect x="676" y="193" width="78" height="8" rx="4" fill="#f85149"/>
    <polyline points="772,201 780,199 788,196 796,192 804,189 812,186" fill="none" stroke="#f85149" stroke-width="1.4"/>
    <text x="858" y="201" text-anchor="end" fill="#f85149" font-size="12" font-weight="700">91%</text>

    <!-- linha vps -->
    <circle cx="626" cy="241" r="3.5" fill="#3fb950"/>
    <text x="636" y="245" fill="#c9d1d9" font-size="12">vps</text>
    <rect x="676" y="237" width="86" height="8" rx="4" fill="#0b0e14"/>
    <rect x="676" y="237" width="19" height="8" rx="4" fill="#c9d1d9"/>
    <polyline points="772,245 780,246 788,243 796,244 804,242 812,243" fill="none" stroke="#4a5563" stroke-width="1.4"/>
    <text x="858" y="245" text-anchor="end" fill="#c9d1d9" font-size="12">22%</text>

    <line x1="628" y1="262" x2="862" y2="262" stroke="#1b2130"/>
    <text x="630" y="284" fill="#f85149" font-size="11.5">!  nas · /tank 91%</text>

    <!-- bandeja -->
    <rect x="630" y="298" width="30" height="30" rx="7" fill="#0b0e14" stroke="#263041"/>
    <text x="645" y="318" text-anchor="middle" fill="#c9d1d9" font-size="11">47°</text>
    <circle cx="656" cy="302" r="3" fill="#f85149">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="672" y="311" fill="#6b7684" font-size="10">ícone muda de cor</text>
    <text x="672" y="324" fill="#6b7684" font-size="10">e notifica quando muda</text>
  </g>

  <!-- ============ CONSOLE: escreve "request" e depois "response" ============ -->
  <text x="326" y="432" fill="#6b7684" font-size="12">»</text>
  <!-- request (digitado) -->
  <text x="344" y="432" font-size="12" clip-path="url(#typeReq)">
    <tspan fill="#58a6ff" font-weight="700">request</tspan><tspan fill="#6b7684">  →  GET /metrics · Bearer token</tspan>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.345;0.365;1"/>
  </text>
  <!-- response (digitado, logo depois) -->
  <text x="344" y="432" font-size="12" clip-path="url(#typeResp)">
    <tspan fill="#3fb950" font-weight="700">response</tspan><tspan fill="#6b7684">  ←  200 OK · métricas recebidas</tspan>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.382;0.383;0.86;0.88"/>
  </text>
</svg>
