# Corta o release quando uma tag vX.Y.Z e empurrada.
#
#     git tag -a v4.0.0 -m "v4.0.0 — titulo\n\nnotas..." && git push origin v4.0.0
#
# A primeira linha da mensagem da tag vira o titulo do release e o resto vira
# o corpo. Os binarios sao os mesmos que o `make pacote` gera na maquina, so
# que construidos aqui, a partir do que esta na tag.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    name: publicar ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # precisa do historico e da mensagem da tag

      - uses: actions/setup-go@v7
        with:
          go-version-file: linux-agent/go.mod
          cache: false

      - name: Bibliotecas de janela
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev

      # A tag e a fonte da verdade do numero, mas cada modulo carrega a sua
      # versao dentro dele. Divergir aqui significa um agente que responde
      # /version diferente do que o release diz - melhor falhar agora.
      #
      # O checar-versao.sh varre TODO lugar que declara versao, em vez de
      # conferir uma lista fixa: modulo novo entra sozinho na conferencia.
      - name: Confere que a tag bate com o codigo
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          ./checar-versao.sh "$VERSAO"

      # Pacote quebrado nao chega no host de ninguem: testa antes de empacotar.
      - name: Testes
        run: make teste

      - name: Empacota
        run: ./empacotar.sh "$VERSAO"

      - name: Confere o que o auto-update precisa
        run: |
          test -f dist/sysmon-windows-amd64.exe
          grep -q ' sysmon-windows-amd64.exe$' dist/SHA256SUMS
          ( cd dist && sha256sum -c SHA256SUMS )
          ./dist/sysmon-linux-amd64 --version >/dev/null

      # Titulo = primeira linha da mensagem da tag; notas = o resto. Tag sem
      # mensagem (leve) cai no changelog automatico do proprio GitHub.
      - name: Monta as notas
        id: notas
        run: |
          MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "${MSG// /}" ]; then
            echo "gerar=sim" >> "$GITHUB_OUTPUT"
            echo "titulo=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "gerar=nao" >> "$GITHUB_OUTPUT"
            echo "titulo=$(printf '%s\n' "$MSG" | head -n1)" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$MSG" | tail -n +2 > NOTAS.md
          fi

      - name: Publica o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notas.outputs.gerar }}" = "sim" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "${{ steps.notas.outputs.titulo }}" \
              --generate-notes --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "${{ steps.notas.outputs.titulo }}" \
              --notes-file NOTAS.md --latest
          fi

      # O cliente ja instalado consulta o release mais novo e espera estes dois
      # nomes exatos. Confere pela API, do lado de fora, o que foi publicado.
      - name: Confere o release publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOMES=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$NOMES"
          echo "$NOMES" | grep -qx 'sysmon-windows-amd64.exe'
          echo "$NOMES" | grep -qx 'sysmon-linux-amd64'
          echo "$NOMES" | grep -qx 'SHA256SUMS'
          echo "$NOMES" | grep -qx "sysmon-agent-$VERSAO-linux-amd64.tar.gz"
          echo "$NOMES" | grep -qx "sysmon-agent-$VERSAO-linux-arm64.tar.gz"
          echo "$NOMES" | grep -qx "sysmon-windows-$VERSAO.zip"
          echo "$NOMES" | grep -qx "sysmon-linux-$VERSAO.tar.gz"
