# Roda a cada push e pull request. E a mesma bateria do `make teste` que roda
# na maquina, mais o empacotamento - porque quebrar o pacote e tao ruim quanto
# quebrar o codigo, e so se descobre tentando empacotar.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Barato e primeiro: versao fora de sincronia entre os modulos so aparecia
  # na hora de cortar a tag, quando ja e tarde e chato de corrigir.
  versao:
    name: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./checar-versao.sh

  agente:
    name: agente (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: linux-agent/go.mod
          # O agente nao tem dependencia externa: sem go.sum, o cache do
          # setup-go falha procurando o arquivo.
          cache: false

      # vet + gofmt + go test, igual ao alvo `checagem` do Makefile.
      - name: Checagem
        run: make -C linux-agent checagem

      # O agente serve HTTP e coleta em varias goroutines: corrida aqui vira
      # leitura errada no cliente.
      - name: Testes com -race
        run: make -C linux-agent teste

      - name: Compila para amd64 e arm64
        run: make -C linux-agent dist

  # Cliente em Go: a migracao do Python acontece aqui, pacote a pacote.
  cliente-go:
    name: cliente (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cliente/go.mod
          cache: false
      # O Gio so precisa de CGO no Linux (X11/Wayland). Para Windows ele
      # cross-compila sem nada disso - por isso o build de release nao carrega
      # esta lista, so a checagem que roda aqui.
      - name: Bibliotecas de janela (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev

      - name: Checagem
        run: |
          cd cliente
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "gofmt pendente:"; gofmt -l .; exit 1; }
          go test ./...

      # O alvo que de fato sera distribuido: sem CGO, do Linux, sem runner
      # Windows. Se isto quebrar, a migracao perdeu a razao de ser.
      - name: Cross-compila para Windows
        run: |
          cd cliente
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags "-s -w -H windowsgui" -o /tmp/sysmon.exe ./cmd/sysmon
          ls -lh /tmp/sysmon.exe

  pacote:
    name: pacote
    runs-on: ubuntu-latest
    needs: [versao, agente, cliente-go]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: linux-agent/go.mod
          cache: false

      # O empacotar compila o cliente Linux, e a janela la exige CGO.
      - name: Bibliotecas de janela
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev

      # Sem argumento, o empacotar.sh tira a versao do arquivo VERSAO - que
      # e exatamente o que queremos conferir aqui.
      - name: Empacota
        run: ./empacotar.sh

      # O auto-update baixa o binario e o confere contra o SHA256SUMS. Se um
      # dos dois sumir do release, o cliente instalado recusa a atualizacao -
      # e fica preso na versao que tem, sem saber por que.
      - name: Confere o que o auto-update precisa
        run: |
          test -f dist/sysmon-windows-amd64.exe
          test -f dist/sysmon-linux-amd64
          grep -q ' sysmon-windows-amd64.exe$' dist/SHA256SUMS
          ( cd dist && sha256sum -c SHA256SUMS )

      # Roda o binario de verdade: um cliente que nao abre nao serve de nada.
      - name: Fuma o cliente
        run: ./dist/sysmon-linux-amd64 --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
