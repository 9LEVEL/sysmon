# Roda a cada push e pull request. E a mesma bateria do `make teste` que roda
# na maquina, mais o empacotamento - porque quebrar o pacote e tao ruim quanto
# quebrar o codigo, e so se descobre tentando empacotar.
#
# Um modulo Go so desde a v5.0: os dois jobs separados de antes (um por
# modulo) viraram um.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # O Gio so precisa de CGO no Linux (X11/Wayland). Para Windows ele
  # cross-compila sem nada disso.
  LIBS_JANELA: >-
    pkg-config libx11-dev libx11-xcb-dev libxkbcommon-dev
    libxkbcommon-x11-dev libwayland-dev libvulkan-dev
    libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev

jobs:
  # Barato e primeiro: versao fora de sincronia so aparecia na hora de cortar
  # a tag, quando ja e tarde e chato de corrigir.
  versao:
    name: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./checar-versao.sh

  codigo:
    name: codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Sem dependencia externa fora do Gio: o cache do setup-go nao tem
          # o que fazer aqui.
          cache: false

      - name: Bibliotecas de janela (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $LIBS_JANELA

      # vet + gofmt + go test + o agente com -race, igual ao `make teste`.
      #
      # O -race exige cgo, e o agente e compilado com CGO_ENABLED=0 para ser
      # estatico: por isso ele so aparece no alvo de teste, nunca no de build.
      - name: Testes
        run: make teste

      # O alvo que de fato sera distribuido no Windows, que e o foco do
      # projeto. Se isto quebrar, nao adianta o resto passar.
      - name: Cross-compila para Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags "-s -w -H windowsgui" -o /tmp/sysmon.exe ./cmd/sysmon
          ls -lh /tmp/sysmon.exe

  pacote:
    name: pacote
    runs-on: ubuntu-latest
    needs: [versao, codigo]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # O empacotar compila o cliente Linux, e a janela la exige CGO.
      - name: Bibliotecas de janela
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $LIBS_JANELA

      # Sem argumento, o empacotar.sh tira a versao do arquivo VERSAO - que
      # e exatamente o que queremos conferir aqui.
      - name: Empacota
        run: ./empacotar.sh

      # O auto-update baixa o binario e o confere contra o SHA256SUMS. Se um
      # dos dois sumir do release, o cliente instalado recusa a atualizacao -
      # e fica preso na versao que tem, sem saber por que.
      - name: Confere o que o auto-update precisa
        run: |
          test -f dist/sysmon-windows-amd64.exe
          test -f dist/sysmon-linux-amd64
          grep -q ' sysmon-windows-amd64.exe$' dist/SHA256SUMS
          ( cd dist && sha256sum -c SHA256SUMS )

      # Roda os dois binarios de verdade: um que nao abre nao serve de nada.
      - name: Fuma os binarios
        run: |
          ./dist/sysmon-linux-amd64 --version
          tar xzf dist/sysmon-agent-*-linux-amd64.tar.gz -C /tmp
          /tmp/sysmon-agent-*-linux-amd64/sysmon-agent --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
